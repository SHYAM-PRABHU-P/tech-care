<body>

 <!-- Enhanced Almost Done Modal with Scrolling Districts -->
<div class="modal" id="infoModal" onclick="if(event.target === this) hideModal('infoModal')">
    <div class="modal-content" onclick="event.stopImmediatePropagation()">

<script>

let isLoggedIn = false;
let userInitial = 'S';
let userFullName = '';
let userEmail = '';
let stream = null;

// ==================== DISTRICTS ====================
const tamilNaduDistricts = [
    "Chennai","Coimbatore","Madurai","Tiruchirappalli","Salem",
    "Erode","Tirunelveli","Vellore","Thoothukudi","Thanjavur",
    "Kanchipuram","Dindigul","Cuddalore","Kanyakumari","Namakkal",
    "Karur","Krishnagiri","Dharmapuri","Ramanathapuram","Sivaganga"
];

const modalLocationInput = document.getElementById('modalLocationInput');
const modalDistrictList = document.getElementById('modalDistrictList');

function renderModalDistricts(filteredList) {
    modalDistrictList.innerHTML = '';
    filteredList.forEach(district => {
        const div = document.createElement('div');
        div.className = 'district-item';
        div.textContent = district;
        div.onclick = () => {
            modalLocationInput.value = district;
            modalDistrictList.classList.remove('show');
        };
        modalDistrictList.appendChild(div);
    });
}

modalLocationInput.addEventListener('click', () => {
    renderModalDistricts(tamilNaduDistricts);
    modalDistrictList.classList.add('show');
});

modalLocationInput.addEventListener('input', () => {
    const searchTerm = modalLocationInput.value.toLowerCase();
    const filtered = tamilNaduDistricts.filter(d => d.toLowerCase().includes(searchTerm));
    renderModalDistricts(filtered);
    modalDistrictList.classList.add('show');
});

document.addEventListener('click', (e) => {
    if (!modalLocationInput.contains(e.target) && !modalDistrictList.contains(e.target)) {
        modalDistrictList.classList.remove('show');
    }
});

// ==================== LOGIN ====================
function loadLoginState() {
    if (localStorage.getItem('techcare_isLoggedIn') === 'true') {
        isLoggedIn = true;
        userInitial = localStorage.getItem('techcare_userInitial') || 'S';
        userFullName = localStorage.getItem('techcare_fullName') || '';
        userEmail = localStorage.getItem('techcare_email') || '';
    }
    updateNavbar();
}

function updateNavbar() {
    const navRight = document.getElementById('navRight');
    navRight.innerHTML = isLoggedIn 
        ? `<div class="user-avatar" onclick="toggleProfilePopup()">${userInitial}</div>` 
        : `<button class="login-btn" onclick="showLoginModal()">Login</button>`;
}

function toggleProfilePopup() {
    const popup = document.getElementById('profilePopup');
    document.getElementById('popupName').textContent = userFullName || 'Not set';
    document.getElementById('popupEmail').textContent = userEmail || 'Not set';
    document.getElementById('popupAvatar').textContent = userInitial;
    popup.classList.toggle('show');
}

function showLoginModal() { 
    document.getElementById('loginModal').style.display = 'flex'; 
}

function hideModal(id) { 
    document.getElementById(id).style.display = 'none'; 
}

// ==================== LOGIN API ====================
async function performLogin() {
    const name = document.getElementById('loginName').value.trim();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!email || !password) {
        alert("Please enter email and password");
        return;
    }

    try {
        const res = await fetch("http://localhost:5678/webhook-test/login-check", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                name, email, password,
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString()
            })
        });

        const data = await res.json();

        if (data.status === "exists") {
            userFullName = name;
            userEmail = email;
            userInitial = name ? name[0].toUpperCase() : 'U';
            isLoggedIn = true;

            localStorage.setItem('techcare_isLoggedIn', 'true');
            localStorage.setItem('techcare_userInitial', userInitial);
            localStorage.setItem('techcare_fullName', name);
            localStorage.setItem('techcare_email', email);

            hideModal('loginModal');
            updateNavbar();

            alert("✅ Login successful!");
        } else {
            if (confirm("No account found. Create new account?")) {
                window.location.href = "second.html";
            }
        }

    } catch (err) {
        console.error(err);
        alert("Server error");
    }
}

// ==================== LOGOUT ====================
function logout() {
    isLoggedIn = false;
    localStorage.clear();
    document.getElementById('profilePopup').classList.remove('show');
    updateNavbar();
}

// ==================== PROBLEM ====================
function sendProblem() {
    const problemVal = document.getElementById('problemInput').value.trim();
    if (problemVal === "") {
        alert("Please describe your problem");
        return;
    }
    if (!isLoggedIn) { showLoginModal(); return; }
    document.getElementById('infoModal').style.display = 'flex';
}

// ==================== SUBMIT (MAIN FIX) ====================
async function submitModal() {
    const mobile_type = document.getElementById('modalName').value.trim();
    const location = document.getElementById('modalLocationInput').value.trim();
    const problem = document.getElementById('problemInput').value.trim();

    if (!mobile_type || !location || !problem) {
        alert("Please fill all fields");
        return;
    }

    navigator.geolocation.getCurrentPosition(async (position) => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        try {
            const res = await fetch("http://localhost:5678/webhook-test/loginlocation", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    mobile_type,
                    email: userEmail || "N/A",
                    
                    problem,
                    location,
                    latitude,
                    longitude,
                    date: new Date().toLocaleDateString(),
                    time: new Date().toLocaleTimeString()
                })
            });

            const data = await res.json();
            console.log("DATA FROM N8N:", data);
            if (Array.isArray(data) && data.length > 0) {

    // ✅ Save FULL response directly
    localStorage.setItem("shopsData", JSON.stringify(data));

    // ✅ Go to next page
    window.location.href = "fourth.html";

} else {
    alert("❌ No shops found");
}

        } catch (err) {
            console.error(err);
            alert("Server error");
        }

    }, () => {
        alert("Location permission denied ❌");
    });
}
   // Auto-changing cards
        const laptops = [{ img: "assets/images/lenovo.png", brand: "lenovo", model: "Lenovo LOQ", specs: "battery . screen . keyboard" },
                         { img: "assets/images/acer.png", brand: "asus", model: "ASUS Vivobook", specs: "battery . screen . processor" },
                         { img: "assets/images/hp.png", brand: "hp", model: "HP Pavilion", specs: "battery . screen . graphics" }];
        const mobiles = [{ img: "assets/images/relme-16-pro-gray-removebg-preview.png", brand: "realme", model: "Realme P3 Pro 5G", specs: "battery . screen . display" },
                         { img: "assets/images/galaxy-s24ultra-titaniumgray-device-spen-front-removebg-preview.png", brand: "samsung", model: "Samsung s24 utlta", specs: "battery . camera . display" },
                         { img: "assets/images/redmi-16-pro-gray-removebg-preview.png", brand: "realme", model: "realme 16 pro", specs: "battery . performance . camera" }];

        let laptopIndex = 0, mobileIndex = 0;
        const laptopProduct = document.getElementById('laptopProduct');
        const mobileProduct = document.getElementById('mobileProduct');

        function updateLaptop() {
            const item = laptops[laptopIndex];
            laptopProduct.innerHTML = `<img src="${item.img}" alt="${item.model}"><div class="product-info"><span class="brand-badge">${item.brand}</span><h3>${item.model}</h3><p>${item.specs}</p></div>`;
            laptopIndex = (laptopIndex + 1) % laptops.length;
        }
        function updateMobile() {
            const item = mobiles[mobileIndex];
            mobileProduct.innerHTML = `<img src="${item.img}" alt="${item.model}"><div class="product-info"><span class="brand-badge">${item.brand}</span><h3>${item.model}</h3><p>${item.specs}</p></div>`;
            mobileIndex = (mobileIndex + 1) % mobiles.length;
        }


// ==================== CAMERA ====================
function openCamera() {
    const modal = document.getElementById('cameraModal');
    const video = document.getElementById('liveVideo');

    navigator.mediaDevices.getUserMedia({ video: true })
        .then(s => {
            stream = s;
            video.srcObject = stream;
            modal.style.display = 'flex';
        })
        .catch(() => alert("Cannot access camera"));
}

function closeCamera() {
    if (stream) stream.getTracks().forEach(track => track.stop());
    document.getElementById('cameraModal').style.display = 'none';
}

// ==================== INIT ====================
        loadLoginState();
        updateLaptop();
        updateMobile();
        setInterval(() => { updateLaptop(); updateMobile(); }, 2000);

</script>
